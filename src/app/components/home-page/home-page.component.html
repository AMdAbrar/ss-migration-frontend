<div class="min-h-screen bg-white">
    <!-- Top Bar -->
    <div class="bg-primary text-white px-4 py-2">
        <div class="container">
            <div class="top-bar">
                <div class="social-icons">
                    <a href="#" class="hover-opacity-80"><i class="fab fa-linkedin"></i></a>
                    <a href="#" class="hover-opacity-80"><i class="fab fa-youtube"></i></a>
                    <a href="#" class="hover-opacity-80"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="hover-opacity-80"><i class="fab fa-twitter"></i></a>
                </div>
                <div class="contact-info">
                    <a href="tel:866.588.0495" class="hover-opacity-80">
                        <i class="fas fa-phone"></i>
                        866.588.0495
                    </a>
                    <div class="nav-right">
                        <ul class="loginout">
                            <!-- Show Login or Logout based on the user's login status -->
                            <a *ngIf="!isLoggedIn" (click)="toggleLoginLogout()">Login</a>
                            <a *ngIf="isLoggedIn" (click)="toggleLoginLogout()">Logout</a>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Main Navigation -->
    <header class="border-b">
        <div class="nav-container">
            <nav class="main-nav">
                <img src="https://conseroglobal.com/wp-content/uploads/2020/11/Consero_Logo_dark.svg" class="logo">
                <div class="nav-links">
                    <a href="#"  (click)="preventLogout()">Home</a>
                    <!-- Internet -->
                    <div class="nav-item">
                        <!-- <a href="#" [class.disabled]="!isLoggedIn" (click)="isLoggedIn ? null : $event.preventDefault()">Internet/Gdrive/OneDrive</a> -->
                        <div class="nav-item">
                            <a href="#" (click)="preventLogout()">Internet/Gdrive/OneDrive</a>
                        </div>
                        <div *ngIf="isLoggedIn" class="services-panel">
                            <div class="panel-content">
                                <div class="service-column">
                                    <app-internal-links></app-internal-links>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Apps -->
                    <div class="nav-item">
                        <div class="nav-item">
                            <a href="#" (click)="preventLogout()">Apps</a>
                        </div>
                        <div *ngIf="isLoggedIn" class="services-panel">
                            <div class="panel-content">
                                <div class="service-column">
                                    <app-app-links></app-app-links>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- About Us -->
                    <div class="nav-item">
                        <!-- <a
                            href="#"
                            [class.disabled]="!isLoggedIn"
                            (click)="isLoggedIn ? null : $event.preventDefault()"
                        >
                            About Us
                        </a> -->
                        <div class="nav-item">
                            <a href="#" (click)="preventLogout()">About Us</a>
                        </div>
                        <div *ngIf="isLoggedIn" class="services-panel">
                            <div class="panel-content">
                                <div class="service-column">
                                    <app-about-page></app-about-page>
                                </div>
                            </div>
                        </div>
                    </div>
                    <a href="#" class="connect-btn"  (click)="preventLogout()">
                        Connect With Us
                    </a>
                </div>
            </nav>
        </div>
    </header>
</div>
